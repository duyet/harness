id = "harness"
name = "Harness"
version = "0.0.5"
description = "Persistent local agent harness. Separate from herdr-desk."
min_herdr_version = "0.7.0"
platforms = ["linux", "macos"]

[[startup]]
command = ["bin/harness", "start"]

[[actions]]
id = "start"
title = "Start the local harness"
command = ["bin/harness", "start"]

[[actions]]
id = "status"
title = "Show harness status"
command = ["bin/harness", "status"]

[[actions]]
id = "upgrade"
title = "Check for CLI upgrades (stub)"
command = ["bin/harness", "upgrade"]

[[actions]]
id = "resume"
title = "Restart + resume last harness session (bind as Ctrl+G via user config)"
command = ["bin/harness", "resume"]

[[actions]]
id = "gateway-start"
title = "Start local Matrix/Telegram gateway stub"
command = ["bin/harness", "gateway", "start"]

[[actions]]
id = "gateway-status"
title = "Show gateway bind, pid, last ingress"
command = ["bin/harness", "gateway", "status"]

[[actions]]
id = "gateway-stop"
title = "Stop local gateway"
command = ["bin/harness", "gateway", "stop"]

[[actions]]
id = "issues-list"
title = "List mock Sentry/Bugsink GitHub issue drafts"
command = ["bin/harness", "issues", "list"]

[[actions]]
id = "pick"
title = "Pick next task (issues > config tasks > freeform)"
command = ["bin/harness", "pick"]

[[actions]]
id = "summary"
title = "On-demand daily summary (no cron)"
command = ["bin/harness", "summary"]
