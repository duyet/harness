<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Harness chat</title>
  <style>
    :root { color-scheme: dark; --bg:#0b0b0c; --fg:#e8e8ea; --muted:#8b8b93; --line:#2a2a2e; --acc:#7c8cff; }
    * { box-sizing: border-box; }
    body { margin:0; font: 15px/1.45 system-ui, sans-serif; background:var(--bg); color:var(--fg); height:100vh; display:flex; flex-direction:column; }
    header { padding:12px 16px; border-bottom:1px solid var(--line); font-weight:600; }
    header span { font-weight:400; color:var(--muted); font-size:13px; }
    #log { flex:1; overflow:auto; padding:16px; display:flex; flex-direction:column; gap:10px; }
    .msg { max-width:72ch; padding:10px 12px; border:1px solid var(--line); border-radius:10px; white-space:pre-wrap; }
    .user { align-self:flex-end; }
    .asst { align-self:flex-start; }
    form { display:flex; gap:8px; padding:12px 16px; border-top:1px solid var(--line); }
    input { flex:1; background:#161618; color:var(--fg); border:1px solid var(--line); border-radius:8px; padding:10px 12px; }
    button { background:var(--acc); color:#111; border:0; border-radius:8px; padding:10px 14px; font-weight:600; cursor:pointer; }
  </style>
</head>
<body>
  <header>Harness chat <span>stub · POST /chat · no LLM</span></header>
  <div id="log"></div>
  <form id="f">
    <input id="t" autocomplete="off" placeholder="task: mvp-review" />
    <button type="submit">Send</button>
  </form>
  <script>
    const log = document.getElementById("log");
    function add(role, text) {
      const d = document.createElement("div");
      d.className = "msg " + (role === "user" ? "user" : "asst");
      d.textContent = text;
      log.appendChild(d);
      log.scrollTop = log.scrollHeight;
    }
    async function refresh() {
      try {
        const s = await fetch("/status").then(r => r.json());
        const ev = s.lastEvent;
        if (ev && ev.at) {
          const hint = "lastEvent " + ev.source + " " + (ev.taskId || ev.text || "");
          if (!log.dataset.last || log.dataset.last !== ev.at) {
            log.dataset.last = ev.at;
          }
          document.querySelector("header span").textContent = hint;
        }
      } catch {}
    }
    setInterval(refresh, 4000);
    refresh();
    document.getElementById("f").onsubmit = async (e) => {
      e.preventDefault();
      const input = document.getElementById("t");
      const text = input.value.trim();
      if (!text) return;
      input.value = "";
      add("user", text);
      const r = await fetch("/chat", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ text }),
      });
      const j = await r.json();
      add("asst", j.reply || JSON.stringify(j));
      refresh();
    };
  </script>
</body>
</html>
